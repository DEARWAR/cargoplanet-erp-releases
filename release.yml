name: Build and publish release

# Push a tag like v1.0.4  ->  builds the installer  ->  publishes it to the PUBLIC releases repo.
on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Stamp version from the tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          (Get-Content version.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$v`"" | Set-Content version.py

      - name: Build app
        run: pyinstaller main.spec --noconfirm

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss

      - name: Publish to releases repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "installer_out/CargoPlanetERP-Setup.exe" `
            --repo "${{ vars.RELEASES_REPO }}" `
            --title "${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES.md
